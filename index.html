<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NonSense Repacks</title>
<meta name="description" content="Репаки игр от NonSense: без вырезанного контента, с русским установщиком.">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="inner top-inner">
    <a class="brand" href="#/">
      <img src="images/logo.png" alt="" width="30" height="30">
      <span>NonSense <b>Repacks</b></span>

    <nav class="nav">
      <a href="#/" data-route="catalog">Репаки</a>
      <a href="#/about" data-route="about">О репаках</a>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="search" type="search" placeholder="Поиск по названию" autocomplete="off">
    </label>
  </div>
</header>

<main id="view" class="view inner"></main>

<footer class="bottom">
  <div class="inner bottom-inner">
    <span>NonSense Repacks</span>
    <span class="muted">Поддержите разработчиков — покупайте игры, которые вам понравились.</span>

<script src="assets/app.js"></script>
